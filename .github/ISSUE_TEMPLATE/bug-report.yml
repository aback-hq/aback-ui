name: Bug report
description: A component, block, the CLI, or the docs site does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not report a security vulnerability here; follow [SECURITY.md](https://github.com/devvrat-hans/aback-ui/blob/main/SECURITY.md) instead.
  - type: input
    id: item
    attributes:
      label: Component, block, or command
      description: Its name as the docs show it, such as Listbox, Pricing, or `aback-ui add`.
      placeholder: Listbox
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How it is installed
      options:
        - Copied with the aback-ui CLI
        - Imported from @aback-ui/ui
        - Only seen on abackui.com
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The @aback-ui/ui or aback-ui version, from your package.json or `npx aback-ui@latest --version`.
      placeholder: 0.3.0
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code or the exact steps that show the problem. A link to a repository or sandbox helps most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Framework and version, browser, and any assistive technology involved.
      placeholder: Next.js 16, Chrome 142, VoiceOver
